name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Formatting check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

  commitlint:
    name: Commit message check
    runs-on: ubuntu-latest
    # Only meaningful on PRs, where there's a range of commits to check
    # against the base branch. A push to main is already a merge commit.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@v6
